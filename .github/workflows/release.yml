name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          tag_oid="$(git rev-parse "$GITHUB_REF_NAME^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid" --jq .verification.verified)" = true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run verify
      - name: Confirm runtime exists before publishing plugin
        run: |
          runtime_version="$(node -p "require('./package.json').dependencies['@kujolang/kujo-runtime']")"
          npm view "@kujolang/kujo-runtime@$runtime_version" version
      - name: Build release artifacts
        id: pack
        run: |
          npm pack --ignore-scripts --json > npm-pack.json
          tarball="$(node -p "JSON.parse(require('fs').readFileSync('npm-pack.json','utf8'))[0].filename")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          sha256sum "$tarball" > "$tarball.sha256"
          npm sbom --sbom-format cyclonedx > paperclip.cdx.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish verified tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}" --ignore-scripts --access public --provenance
      - name: Verify public registry install
        run: |
          package_version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if test "$(npm view "@kujolang/paperclip@$package_version" version 2>/dev/null || true)" = "$package_version"; then
              break
            fi
            if test "$attempt" = 30; then
              echo "Published package did not become visible in the registry" >&2
              exit 1
            fi
            sleep 10
          done
          npm install --prefix "$RUNNER_TEMP/paperclip-clean-install" --ignore-scripts --no-audit --no-fund --no-package-lock "@kujolang/paperclip@$package_version"
          test "$(node -p "require('$RUNNER_TEMP/paperclip-clean-install/node_modules/@kujolang/paperclip/package.json').version")" = "$package_version"
      - name: Create GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --title "Paperclip $GITHUB_REF_NAME"
          "${{ steps.pack.outputs.tarball }}"
          "${{ steps.pack.outputs.tarball }}.sha256"
          paperclip.cdx.json
          bundled/kujo-components.lock.json
          schemas/*.json
        env:
          GH_TOKEN: ${{ github.token }}
