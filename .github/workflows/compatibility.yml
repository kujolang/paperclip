name: Compatibility

on:
  pull_request:
  schedule:
    - cron: "43 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24.11.0, 24.x]
        sdk: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.sdk == 'latest'
        run: npm install --no-save --ignore-scripts --include=optional @paperclipai/plugin-sdk@latest
      - if: matrix.sdk == 'minimum'
        run: npm run verify
      - if: matrix.sdk == 'latest'
        run: npm run repository:verify && npm run typecheck && npm test && npm run components:verify && npm run build
