version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
