[package]
name = "muzzle"
version = "1.1.3"
description = "Quiet workflow runner for AI-assisted development. Kujo-native CLI with modular runner support (Kujo default, Bash, Python, Node). Captures noisy logs to files, prints compact agent-friendly summaries."
license = "MIT"
authors = ["Kujolang <contact@kujolang.ai>"]
repository = "https://github.com/kujolang/muzzle"
keywords = ["kujo", "workflow", "cli", "agent-tools", "token-efficiency", "runner"]
categories = ["developer-tools"]
readme = "README.md"

[package.status]
stage = "production"
stability = "stable"
public_api = true
notes = "Stable trusted-local workflow runner with documented CLI, JSON summary, manifest, log, report, and loop contracts."

[kujo]
minimum_version = "1.0.0"
entry = "muzzle.kujo"
sources = ["src", "."]
includes = ["README.md", "AGENTS.md", "docs", "muzzle", "LICENSE"]
excludes = [".git", ".muzzle/logs", ".muzzle/reports", ".muzzle/state", ".dogfood", "dist", "build", ".kujo_cache"]

[bin]
muzzle = "muzzle"

[scripts]
test = "muzzle run hello"
smoke = "muzzle run hello --json"
