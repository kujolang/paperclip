[package]
name = "workcell"
version = "1.3.0"
description = "Kujo-native Docker-backed disposable execution sandbox for AI agents and workflows."
license = "MIT"
repository = "https://github.com/kujolang/workcell"
keywords = ["kujo", "docker", "sandbox", "agents", "workflows"]
categories = ["developer-tools"]
readme = "README.md"

[package.status]
stage = "production"
stability = "stable"
public_api = true
notes = "Stable local Docker/Podman CLI, definition, receipt, verification, and declared-artifact contracts; host, daemon, egress infrastructure, image governance, and compliance remain operator-owned."

[kujo]
minimum_version = "1.6.0"
entry = "main.kujo"
sources = ["src", "."]
includes = ["README.md", "docs", "tests", "examples", "docker", "LICENSE"]
excludes = [".git", ".workcell", ".casefile", ".runledger", "dist", "build", "node_modules"]

[scripts]
test = "bash tests/run.sh"
integration = "bash tests/docker_integration.sh"

[dependencies]
